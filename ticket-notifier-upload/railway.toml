[build]
builder = "dockerfile"

[deploy]
startCommand = "./docker-start.sh"
healthcheckPath = "/api/config"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# One instance only: the alerts, the SQLite file and the single shared browser
# all assume one process. Scaling this horizontally would duplicate every check.
numReplicas = 1
